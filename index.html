<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="logo.png">
    <meta name="description"
          content="Vavilon Network - инновационная блокчейн-сеть с бесплатными транзакциями и доходом от майнинга для валидаторов.">
    <meta name="keywords"
          content="Vavilon Network, блокчейн, бесплатные транзакции, майнинг, валидаторы, PoS, масштабируемость, безопасность">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Vavilon Network - Blockchain Network</title>

    <style>
        body {
            background: #0f1620;
        }

        .loader {
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            margin: -25px 0 0 -25px;
            position: absolute;

            aspect-ratio: 1;
            border-radius: 50%;
            border: 8px solid #86909c;
            border-right-color: #46aef5;
            animation: l2 1s infinite linear;
        }

        @keyframes l2 {
            to {
                transform: rotate(1turn)
            }
        }

    </style>
</head>
<body class="col nowrap" ng-app="App" ng-controller="Controller" style="overflow: hidden">
<div style="position: absolute; left:0; top: 0; width: 100%; height: 100%; z-index: 1"
     ng-style="{'visibility': showBody ? 'hidden' : 'visible'}">
    <div class="loader"></div>
</div>
<div class="flex col" ng-cloak style="visibility: hidden"
     ng-style="{'visibility': showBody ? 'visible' : 'hidden'}">
    <md-tabs class="flex col" md-selected="selectedIndex">
        <md-tab label="0">
            <ng-include src="'./store/index.html?v=15'"></ng-include>
        </md-tab>
        <md-tab label="1">
            <ng-include src="'./wallet/index.html?v=15'"></ng-include>
        </md-tab>
        <md-tab label="2">
            <div class="row input-wrapper m16">
                <img class="img20 img-gray" src="./img/search.svg"/>
                <input type="text"
                       id="search_input"
                       autocomplete="off"
                       oninput="this.value = this.value.toLowerCase().replace(/[^\p{L}0-9_]/gu, '')"
                       ng-model="search_text"
                       ng-change="search()"
                       placeholder=" ">
                <label for="search_input">{{str.type_token_name}}</label>
                <img class="img14 img-gray" src="./img/close.svg"
                     style="position: absolute; right: 14px; top: 18px"
                     ng-show="search_text"
                     ng-click="clear()"/>
            </div>
            <div class="row scroll-horizontal ph8 pt0">
                <div class="text2 ml8 p8 radius-default ripple"
                     ng-class="{'back-active': top_selected == key,
                                'back-gray': top_selected != key}"
                     ng-repeat="(key, value) in tops"
                     ng-click="selectTop(key)">
                    {{value}}
                </div>
            </div>
            <div class="flex col scroll align-start-center">
                <div class="flex col block ph8">
                    <img class="refresh-icon img-gray" src="./img/reload.svg">
                    <ng-include src="'./search/tokens.html?v=15'"></ng-include>
                </div>
            </div>
        </md-tab>
    </md-tabs>
    <div class="col align-start-center fill-width p16 pt8 back-black ng-cloak"
         style="position: absolute; bottom: 0;">
        <div class="row block">
            <div class="flex col pv8 align-start-center ripple relative"
                 ng-repeat="item in menu"
                 ng-click="selectTab($index)">
                <img class="img18" src="./img/{{item}}.svg"
                     ng-class="{'img-accent': selectedIndex == $index, 'img-gray': selectedIndex != $index}">
                <p class="mt8"
                   ng-class="{'text-accent': selectedIndex == $index, 'text-gray': selectedIndex != $index}">
                    {{str[item]}}
                </p>
            </div>
        </div>
    </div>
</div>
